<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre un Selfie</title>
</head>
<body>
    <video id="video" width="100%" autoplay></video>
    <button id="capture">📷 Prendre un selfie</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <p id="linkContainer"></p>

    <script>
        (function() {
            let video = document.getElementById("video");
            let canvas = document.getElementById("canvas");
            let linkContainer = document.getElementById("linkContainer");

            // Activer la caméra frontale
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => video.srcObject = stream);

            document.getElementById("capture").onclick = function() {
                // Capturer l'image
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext("2d").drawImage(video, 0, 0);
                
                // Convertir l'image en Blob
                canvas.toBlob(blob => {
                    let formData = new FormData();
                    formData.append("file", blob, "selfie.png");

                    // Envoyer l'image sur File.io
                    fetch("https://file.io", {
                        method: "POST",
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            linkContainer.innerHTML = `<a href="${data.link}" target="_blank">📎 Lien du selfie</a>`;
                        } else {
                            linkContainer.innerHTML = "❌ Erreur lors de l'upload.";
                        }
                    })
                    .catch(() => linkContainer.innerHTML = "❌ Erreur de connexion.");
                }, "image/png");
            };
        })();
    </script>
</body>
</html>
