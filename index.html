<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre un Selfie</title>
</head>
<body>
    <video id="video" width="100%" autoplay></video>
    <button id="capture">📷 Prendre un selfie</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <p id="linkContainer"></p>

    <script>
        (function() {
            let video = document.getElementById("video");
            let canvas = document.getElementById("canvas");
            let linkContainer = document.getElementById("linkContainer");

            // Activer la caméra frontale
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => video.srcObject = stream);

            document.getElementById("capture").onclick = function() {
                // Capturer l'image
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext("2d").drawImage(video, 0, 0);
                
                // Convertir l'image en Base64
                let imageData = canvas.toDataURL("image/png").split(',')[1];

                // Envoyer sur ImgBB
                let formData = new FormData();
                formData.append("image", imageData);

                fetch("https://api.imgbb.com/1/upload?key=c8755ae437772ae30f0fda21c29d7e97", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        linkContainer.innerHTML = `<a href="${data.data.url}" target="_blank">📎 Lien du selfie</a>`;
                    } else {
                        linkContainer.innerHTML = "❌ Erreur lors de l'upload.";
                    }
                })
                .catch(() => linkContainer.innerHTML = "❌ Erreur de connexion.");
            };
        })();
    </script>
</body>
</html>
